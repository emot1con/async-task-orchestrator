  # ──────────────────────────────────────────────────────────────
  # 3. Deploy ke VPS via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ versioning ]
    env:
      VERSION: ${{ needs.versioning.outputs.version }}
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cat > /tmp/deploy_script.sh << SCRIPT
          set -e
          VERSION="${VERSION}"

          APP_DIR="/root/project/task-handler"
          cd "\$APP_DIR"

          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          sed -i "s|numpyh/task-handler-api:.*|numpyh/task-handler-api:\${VERSION}|g" docker-compose.yaml
          sed -i "s|numpyh/task-handler-task-worker:.*|numpyh/task-handler-task-worker:\${VERSION}|g" docker-compose.yaml
          sed -i "s|numpyh/task-handler-notification-worker:.*|numpyh/task-handler-notification-worker:\${VERSION}|g" docker-compose.yaml
          sed -i "s|numpyh/task-handler-migrate:.*|numpyh/task-handler-migrate:\${VERSION}|g" docker-compose.yaml
          sed -i "s|numpyh/task-handler-logstash:.*|numpyh/task-handler-logstash:\${VERSION}|g" docker-compose.yaml
          sed -i "s|numpyh/task-handler-filebeat:.*|numpyh/task-handler-filebeat:\${VERSION}|g" docker-compose.yaml

          docker compose pull api task-worker notification-worker migrate logstash filebeat
          docker compose up -d --no-build --remove-orphans \
            api task-worker notification-worker migrate logstash filebeat
          docker image prune -f

          echo "✅ Deployed \${VERSION} successfully"
          SCRIPT

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/deploy_script.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy_script.sh

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "bash /tmp/deploy_script.sh"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /root/project/task-handler && docker compose ps && curl -sf http://localhost:8087/task-handler/api/v1/health && echo '✅ API healthy' || echo '⚠️ health check failed'"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/deploy_script.sh
