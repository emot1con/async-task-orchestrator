name: CD – Build & Deploy

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

# Hanya 1 deploy berjalan sekaligus, yang baru akan queue, yang lama cancel
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write   # untuk git tag & push

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Tentukan version tag berikutnya (auto-increment dari tag terakhir)
  # ──────────────────────────────────────────────────────────────
  versioning:
    name: Bump Version
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu semua tags

      - name: Bump patch version
        id: bump
        run: |
          # Ambil tag terakhir dengan format vX.Y.Z
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)

          if [ -z "$LAST_TAG" ]; then
            # Belum ada tag, mulai dari v6.0.0
            NEW_TAG="v6.0.0"
          else
            # Pecah versi, naikkan patch
            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Last tag  : ${LAST_TAG:-none}"
          echo "New  tag  : $NEW_TAG"
          echo "version=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create & push git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

