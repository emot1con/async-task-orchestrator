services:

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: api
    ports:
      - "8087:8087"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - migrate
      - task-worker
    env_file:
      - .env
    networks:
      - backend
    restart: always
    volumes:
      - ./logs:/var/log/app:z
    labels:
      - "logging.enabled=true"

  task-worker:
    build:
      context: .
      dockerfile: docker/task-worker.Dockerfile
    container_name: task-worker
    depends_on:
      - rabbitmq
      - postgres
      - migrate
    env_file:
      - .env
    networks:
      - backend
    restart: always
    labels:
      - "logging.enabled=true"
    
  notification-worker:
    build:
      context: .
      dockerfile: docker/notification-worker.Dockerfile
    container_name: notification-worker
    depends_on:
      - rabbitmq
      - postgres
      - migrate
    env_file:
      - .env
    networks:
      - backend
    restart: always
    labels:
      - "logging.enabled=true"

  postgres:
    image: postgres:15.15-trixie
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - backend
    restart: always
    

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend
    restart: always
    

  migrate:
    image: migrate/migrate
    container_name: migrate
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:Z
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]
    env_file:
      - .env
    restart: "no"
    networks:
      - backend
  
   # Elasticsearch - Database untuk menyimpan log
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Logstash - Memproses dan mengirim log ke Elasticsearch
  logstash:
    build:
      context: .
      dockerfile: docker/logstash.Dockerfile
    container_name: logstash
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Kibana - Dashboard untuk visualisasi
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - backend
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Filebeat - Mengirim log dari Docker containers ke Logstash
  filebeat:
    build:
      context: .
      dockerfile: docker/filebeat.Dockerfile
    container_name: filebeat
    user: root
    privileged: true
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - backend
    depends_on:
      - logstash
      - api
      - task-worker
      - notification-worker
    command: filebeat -e -strict.perms=false

volumes:
  pgdata:
  redisdata:
  elasticsearch_data:
  filebeat_data:


networks:
  backend:
    driver: bridge
