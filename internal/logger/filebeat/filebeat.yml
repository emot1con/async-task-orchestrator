filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    # include_lines: ['^{.*"level".*}$']
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/lib/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

          
