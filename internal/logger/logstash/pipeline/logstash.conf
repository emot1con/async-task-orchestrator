input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON dari field message jika belum di-parse oleh Filebeat
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  # Tambahkan nama service dari Docker container name
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Hapus field yang tidak diperlukan untuk menghemat storage
  mutate {
    remove_field => [
      "[agent]",
      "[ecs]",
      "[host]",
      "[input]",
      "[log]"
    ]
  }

  # Deduplicate: buat fingerprint unik per log event
  fingerprint {
    source => ["[app][timestamp]", "[app][message]", "[app][service]", "[app][worker_id]", "[app][task_id]"]
    target => "[@metadata][generated_id]"
    method => "SHA256"
    concatenate_sources => true
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][generated_id]}"
  }
}