# Pipeline Logstash
# Input: menerima data dari Filebeat
input {
  beats {
    port => 5044
  }
}

# Filter: memproses dan memparsing log JSON
filter {
  # Hanya proses logs dari api, task-worker, notification-worker
  if [container][name] not in ["api", "task-worker", "notification-worker"] {
    drop { }
  }

  # Parse JSON dari Docker container logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "app"
    }
    
    # Promote app fields ke root level
    mutate {
      rename => {
        "[app][timestamp]" => "timestamp"
        "[app][level]" => "level"
        "[app][message]" => "log_message"
        "[app][method]" => "method"
        "[app][path]" => "path"
        "[app][status]" => "status"
        "[app][duration]" => "duration"
        "[app][service]" => "service"
        "[app][task_id]" => "task_id"
        "[app][cache]" => "cache"
        "[app][user_id]" => "user_id"
        "[app][page]" => "page"
        "[app][limit]" => "limit"
        "[app][worker_id]" => "worker_id"
        "[app][queue]" => "queue"
        "[app][task_type]" => "task_type"
        "[app][retry_count]" => "retry_count"
        "[app][max_retries]" => "max_retries"
        "[app][event_type]" => "event_type"
        "[app][event_id2]" => "event_id"
        "[app][error]" => "error"
        "[app][client_ip]" => "client_ip"
        "[app][user_agent]" => "user_agent"
      }
    }
    
    # Remove app object after promoting fields
    mutate {
      remove_field => ["app"]
    }
  }
  
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Add container metadata
  mutate {
    add_field => {
      "container_name" => "%{[container][name]}"
      "container_id" => "%{[container][id]}"
    }
  }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "task-handler-logs-%{+YYYY.MM.dd}"
    }

    stdout {
        codec => rubydebug
    }
}